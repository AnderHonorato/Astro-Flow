services:
  postgres:
    image: postgres:16-alpine
    container_name: astros-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: astros
      POSTGRES_PASSWORD: astros
      POSTGRES_DB: astros
    ports:
      - "5433:5432"
    volumes:
      - astros-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astros -d astros"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  astros-pgdata:
